name: Audit corrected Gorge cohort certification against private R2
on:
  pull_request:
    paths:
      - "tools/gorge_corrected_cohort_certification.py"
      - ".github/workflows/gorge-corrected-cohort-certification-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    name: Certify source and UI projection, report blockers (${{ matrix.hero }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        hero: [mortarion_current, magnus_premium]
    env:
      ACCOUNT: ${{ secrets.GORGE_R2_ACCOUNT_ID }}
      ACCESS: ${{ secrets.GORGE_R2_ACCESS_KEY_ID }}
      SECRET: ${{ secrets.GORGE_R2_SECRET_ACCESS_KEY }}
      BATCH: "42143344243-1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retrieve immutable source artifact and private R2 projections
        env:
          GH_TOKEN: ${{ github.token }}
          HERO: ${{ matrix.hero }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ACCOUNT" && test -n "$ACCESS" && test -n "$SECRET"
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/ui"
          gh run download 42143344243 --repo "$GITHUB_REPOSITORY" \
            --name "gorge-corrected-fresh-candidate-$HERO" --dir "$RUNNER_TEMP/source"
          export AWS_ACCESS_KEY_ID="$ACCESS" AWS_SECRET_ACCESS_KEY="$SECRET" AWS_DEFAULT_REGION=auto
          endpoint="https://$ACCOUNT.r2.cloudflarestorage.com"
          prefix="s3://gorge-simulations/ui/experimental/corrected-pilot/v1/$BATCH/$HERO"
          aws --endpoint-url "$endpoint" s3 cp "$prefix/ui-original.v1.json" \
            "$RUNNER_TEMP/ui/ui-original.v1.json" --no-progress
          aws --endpoint-url "$endpoint" s3 cp "$prefix/archive-audit.json" \
            "$RUNNER_TEMP/ui/archive-audit.json" --no-progress
      - name: Audit native traces, exact R2 SHA, projected outcomes, and approval gates
        env:
          HERO: ${{ matrix.hero }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from tools.gorge_corrected_cohort_certification import audit
          tmp=Path(os.environ["RUNNER_TEMP"])
          report=audit(tmp/"source/results",tmp/"ui/ui-original.v1.json",
                       tmp/"ui/archive-audit.json",
                       Path("data/gorge_analytics_cohort_registry_v1.json"),
                       batch=os.environ["BATCH"],deck=os.environ["HERO"])
          assert report["source_integrity"]=="passed"
          assert report["verified_decisive_games"]==12
          assert report["projected_games_checked"]==12
          assert report["certification_status"]=="blocked" and not report["publication_eligible"]
          output=tmp/"ui/certification-audit.json"
          output.write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## "+report["deck"]+" · source-verified certification audit\n\n")
              f.write("Native game and R2 projection integrity: **PASS**; games: **12/12**\n\n")
              f.write("Cohort certification and public promotion: **BLOCKED**\n\n")
              for blocker in report["blockers"]:
                  f.write("- "+blocker+"\n")
          print(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corrected-gorge-certification-${{ matrix.hero }}
          path: ${{ runner.temp }}/ui/certification-audit.json
          if-no-files-found: warn
          retention-days: 14
