name: Verify materialized R2 Results
on:
  pull_request:
    paths:
      - "tools/gorge_r2_materialized_results.py"
      - "tools/gorge_r2_full_cohort_insights.py"
      - "tests/test_gorge_r2_full_cohort_insights.py"
      - "tests/test_gorge_r2_insight_attribution.py"
      - "tools/gorge_r2_insight_evidence.py"
      - "tests/test_gorge_materialized_results.py"
      - "tools/gorge_r2_materialized_rollback.py"
      - "tools/gorge_r2_source_inventory.py"
      - "data/gorge_r2_source_inventory_v1.json"
      - ".github/workflows/gorge-r2-materialized-publish.yml"
      - ".github/workflows/gorge-r2-materialized-rollback.yml"
      - ".github/workflows/gorge-r2-materialized-verify.yml"
  push:
    branches: [main]
    paths:
      - "tools/gorge_r2_materialized_results.py"
      - "tests/test_gorge_materialized_results.py"
      - "tools/gorge_r2_source_inventory.py"
      - "data/gorge_r2_source_inventory_v1.json"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'pyarrow==21.0.0'
      - run: python -m unittest tests.test_gorge_materialized_results tests.test_gorge_r2_full_cohort_insights tests.test_gorge_r2_insight_attribution -v
