name: Gorge stock Commander candidate catalog audit

on:
  pull_request:
    paths:
      - "data/gorge_stock_precon_candidates_v1.json"
      - "data/commander_deck_library.json"
      - "tools/audit_gorge_candidate_catalog.py"
      - "tools/import_mtgjson_stock_precons.py"
      - "tests/test_expanded_stock_precons.py"
      - "tests/test_commander_deck_library.py"
      - ".github/workflows/gorge-expanded-precons.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate stock deck candidate importer and identity rules
        run: python -m unittest tests.test_expanded_stock_precons tests.test_commander_deck_library tests.test_gorge_precons_and_replay -v
      - name: Validate at least 100 immutable stock precon candidate lists
        run: |
          python -m tools.audit_gorge_candidate_catalog --minimum 100 --output "$RUNNER_TEMP/candidate-audit.json"
          python - "$RUNNER_TEMP/candidate-audit.json" <<'PY'
          import json,sys,os
          r=json.load(open(sys.argv[1]))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("# Candidate precon catalog (NOT Gorge-qualified)\\n\\n")
              f.write(f"- Structurally valid precons: **{r['candidates']}**\\n")
              f.write(f"- Distinct product set codes: **{r['set_count']}**\\n")
              f.write(f"- Distinct card names: **{r['unique_card_names']}**\\n")
              f.write("- Benchmark admission: **none from this workflow**\\n")
          PY
      - name: Upload read-only catalog integrity report
        uses: actions/upload-artifact@v4
        with:
          name: stock-commander-candidate-audit
          path: ${{ runner.temp }}/candidate-audit.json
          if-no-files-found: error
          retention-days: 14
