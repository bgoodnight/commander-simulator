name: Audit GitHub and R2 storage footprint

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * 1"
  push:
    branches: [main]
    paths:
      - "tools/audit_storage.py"
      - ".github/workflows/storage-audit.yml"
  pull_request:
    paths:
      - "tools/audit_storage.py"
      - "tests/test_storage_audit.py"
      - ".github/workflows/storage-audit.yml"

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test storage inventory calculations
        run: python -m unittest tests.test_storage_audit -v
      - name: Measure repository checkout and generated-data mirrors
        run: python -m tools.audit_storage --github-summary --json-out "$RUNNER_TEMP/storage-audit.json"
      - name: Measure private R2 archive and warehouse consumption
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.GORGE_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.GORGE_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.GORGE_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$R2_ACCOUNT_ID" || -z "$R2_ACCESS_KEY_ID" || -z "$R2_SECRET_ACCESS_KEY" ]]; then
            echo "::warning::R2 inventory unavailable: missing GORGE_R2_* credentials"
            echo "### R2 inventory unavailable (credentials not configured)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto
          endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          echo "### R2 private storage inventory" >> "$GITHUB_STEP_SUMMARY"
          # Enumerate prefix summaries rather than assuming all R2 objects use
          # our two canonical archive namespaces. Never print object names.
          top_prefixes="$(aws --endpoint-url "$endpoint" s3 ls s3://gorge-simulations/ | awk '$1 == "PRE" { print $2 }')"
          for prefix in "" "native/v1/" "warehouse/v1/" $top_prefixes; do
            location="s3://gorge-simulations/$prefix"
            if [[ -z "$prefix" ]]; then label="Entire bucket"; else label="$prefix"; fi
            totals="$(aws --endpoint-url "$endpoint" s3 ls "$location" --recursive --summarize | tail -n 2)"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**$label**" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$totals" >> "$GITHUB_STEP_SUMMARY"
            printf 'R2 inventory %s: %s\n' "$label" "$(printf '%s' "$totals" | tr '\n' ' ')"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Preserve a small inventory snapshot as short-lived artifact
        uses: actions/upload-artifact@v4
        with:
          name: storage-inventory
          path: ${{ runner.temp }}/storage-audit.json
          retention-days: 7
          if-no-files-found: error
