name: Stage 100+ Commander precon candidates

on:
  pull_request:
    paths:
      - "tools/stage_commander_precon_candidates.py"
      - "tests/test_stage_commander_precon_candidates.py"
      - ".github/workflows/stage-commander-precon-candidates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline contracts
        run: python -m unittest tests.test_stage_commander_precon_candidates -v
      - name: Download pinned published deck source and stage 150 candidates
        run: |
          mkdir -p "$RUNNER_TEMP/commander-candidates"
          python -m tools.stage_commander_precon_candidates \
            --out "$RUNNER_TEMP/commander-candidates" --limit 150
          python - <<'PY'
          import json,os
          from pathlib import Path
          c=json.loads((Path(os.environ["RUNNER_TEMP"])/"commander-candidates/catalog.json").read_text())
          assert c["count"]>=100
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write(f"## Staged Commander precon candidates: {c['count']}\n\n")
              f.write(f"Source commit: `{c['source_commit']}`\n\n")
              f.write("Catalog only — no Gorge games, published results, or active opponent changes.\n")
          PY
      - name: Export complete candidate decklists and provenance catalog
        uses: actions/upload-artifact@v4
        with:
          name: commander-precon-candidates-150
          path: ${{ runner.temp }}/commander-candidates/
          retention-days: 14
          if-no-files-found: error
