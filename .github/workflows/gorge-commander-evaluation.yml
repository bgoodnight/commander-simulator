name: ARCHIVED Python · Gorge Commander backend evaluation (experimental)

# ARCHIVED PYTHON SIMULATION: disabled automatic triggers after gorge cutover.
# Reproduce old results from archive/python-rules-pilots-simulations-20261103.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify offline deck export and result schema
        run: |
          python -m unittest discover -s tests -p "test_gorge_benchmark.py" -v
          python -m unittest discover -s tests -p "test_gorge_precons_and_replay.py" -v
          python -m unittest discover -s tests -p "test_gorge_backend.py" -v
      - name: Export four pinned real Commander decks
        run: |
          mkdir -p "$RUNNER_TEMP/gorge-decks" "$RUNNER_TEMP/results"
          python -m tools.export_gorge_decks --out "$RUNNER_TEMP/gorge-decks" --decks mortarion_current magnus_premium necron_dynasties wretched_ranks
      - name: Fetch stock Commander precon opponent decks
        run: |
          python -m tools.fetch_gorge_precons --out "$RUNNER_TEMP/gorge-decks"
      - name: Clone pinned gorge release (not a vendored dependency)
        env:
          GORGE_COMMIT: b78e4c8b16078f6decbc48875bba953ce5535b85
        run: |
          git clone --filter=blob:none https://github.com/adams-shaun/gorge.git "$RUNNER_TEMP/gorge"
          git -C "$RUNNER_TEMP/gorge" checkout --detach "$GORGE_COMMIT"
          echo "Pinned gorge: $(git -C "$RUNNER_TEMP/gorge" rev-parse HEAD)"
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/gorge/go.mod
          cache: false
      - name: Prepare Forge corpus separately from measured runs
        working-directory: ${{ runner.temp }}/gorge
        run: |
          make fetch-cards compile-cards
          make report | head -30
      - name: Build gorge Commander driver
        working-directory: ${{ runner.temp }}/gorge
        run: |
          cp "$GITHUB_WORKSPACE/tools/gorge_commander_probe.go" ./commander_probe.go
          go build -o "$RUNNER_TEMP/commander-probe" ./commander_probe.go
      - name: Measure current Python bounded-pressure baseline
        run: |
          python -m tools.gorge_benchmark baseline --games 4 --turns 10 --seed 100 --output "$RUNNER_TEMP/results/python_baseline.json"
      - name: Run four enriched Commander smoke games across eight-deck pool
        id: gorge_run
        working-directory: ${{ runner.temp }}/gorge
        shell: bash
        run: |
          set +e
          PYTHONPATH="$GITHUB_WORKSPACE" python -m commander_sim.gorge_backend \
            --binary "$RUNNER_TEMP/commander-probe" \
            --corpus "$RUNNER_TEMP/gorge/.cards" --deck-dir "$RUNNER_TEMP/gorge-decks" \
            --decks "mortarion_current,magnus_premium,necron_dynasties,wretched_ranks,avengers-assemble,cavalry-charge,deadly-disguise,science-pip" \
            --pilot bot --games 4 --seed 100 --max-turns 50 \
            --native-dir "$RUNNER_TEMP/results/native" --native-limit 2 --jsonl \
            | tee "$RUNNER_TEMP/results/gorge_runs.jsonl"
          status=${PIPESTATUS[0]}
          echo "$status" > "$RUNNER_TEMP/results/gorge_exit_code.txt"
          echo "gorge_exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run two trials of alternate gorge AI policies
        id: policy_trial
        working-directory: ${{ runner.temp }}/gorge
        shell: bash
        run: |
          set +e
          PYTHONPATH="$GITHUB_WORKSPACE" python -m commander_sim.gorge_backend \
            --binary "$RUNNER_TEMP/commander-probe" \
            --corpus "$RUNNER_TEMP/gorge/.cards" --deck-dir "$RUNNER_TEMP/gorge-decks" \
            --decks "mortarion_current,magnus_premium,necron_dynasties,wretched_ranks,avengers-assemble,cavalry-charge,deadly-disguise,science-pip" \
            --pilot forge-heuristic --hero-pilot lethal-pressure \
            --games 2 --seed 200 --max-turns 50 --jsonl \
            | tee "$RUNNER_TEMP/results/gorge_policy_trial.jsonl"
          status=${PIPESTATUS[0]}
          echo "$status" > "$RUNNER_TEMP/results/policy_exit_code.txt"
          exit 0
      - name: Build native gorge replay indexes without flattening events
        if: steps.gorge_run.outcome == 'success'
        run: |
          python -m tools.gorge_native_replay \
            --native-dir "$RUNNER_TEMP/results/native" \
            --out "$RUNNER_TEMP/results/native_indexes"
      - name: Validate enriched physical card and state snapshots
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" python -m tools.validate_gorge_enrichment \
            --native-dir "$RUNNER_TEMP/results/native" \
            --output "$RUNNER_TEMP/results/enrichment_validation.json"
      - name: Compare measured run characteristics and limitations
        if: steps.gorge_run.outcome == 'success'
        run: |
          python -m tools.gorge_benchmark collect \
            --gorge "$RUNNER_TEMP/results/gorge_runs.jsonl" \
            --baseline "$RUNNER_TEMP/results/python_baseline.json" \
            --output "$RUNNER_TEMP/results/comparison.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"results"/"comparison.json"
          d=json.loads(p.read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("# Experimental gorge vs Python simulation runs\n\n")
              f.write("| Metric | Current Python (abstract pressure) | Gorge (four real decks) |\n")
              f.write("| --- | ---: | ---: |\n")
              for key in ("attempted","completed","failed","stalled_or_horizon_reached","elapsed_seconds","seconds_per_attempt","games_per_minute","median_turns_or_rounds","average_events"):
                  f.write(f'| {key} | {d["baseline"].get(key)} | {d["gorge"].get(key)} |\n')
              f.write("\n**These are not equivalent workloads:** Python simulates three abstract opponent seats; gorge runs real four-deck Commander. Do not compare win rates.\n")
              f.write("\nGorge probe exit code: "+(p.parent/"gorge_exit_code.txt").read_text().strip()+"\n")
          PY
          test "$(cat "$RUNNER_TEMP/results/gorge_exit_code.txt")" = 0
          test "$(cat "$RUNNER_TEMP/results/policy_exit_code.txt")" = 0
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"results"/"gorge_policy_trial.jsonl"
          rows=[json.loads(line) for line in p.read_text().splitlines() if line.strip().startswith("{")]
          assert len(rows)==2 and all(r["finished"] and r["replay_verified"] for r in rows)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("\nTwo alternative gorge AI runs: both finished and replay-verified.\n")
          PY
      - name: Upload evidence without redistributing Forge scripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gorge-commander-evaluation
          path: ${{ runner.temp }}/results/
          if-no-files-found: warn
