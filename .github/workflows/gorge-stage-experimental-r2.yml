name: Preserve verified experimental Gorge evidence in private R2

# One-time source-verified archival of run 42129260132.
# This workflow NEVER grants cohort approval, publishes Pages, or changes the API.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        hero: [mortarion_current, magnus_premium]
    env:
      HERO: ${{ matrix.hero }}
      ACCOUNT: ${{ secrets.GORGE_R2_ACCOUNT_ID }}
      ACCESS: ${{ secrets.GORGE_R2_ACCESS_KEY_ID }}
      SECRET: ${{ secrets.GORGE_R2_SECRET_ACCESS_KEY }}
      BATCH: 42129260132-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify R2 credentials are configured
        run: |
          test -n "$ACCOUNT" && test -n "$ACCESS" && test -n "$SECRET"
      - name: Fetch exact original experimental recording artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          gh run download 42129260132 \
            --name "gorge-precon-60-experimental-gameplay-$HERO" \
            --dir "$RUNNER_TEMP/source"
      - name: Exclude unfinished games without changing source evidence
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          src=root/"source/results"
          dest=root/"verified"
          (dest/"native").mkdir(parents=True)
          summary=json.loads((src/"qualification-summary.json").read_text())
          hero=os.environ["HERO"]
          expected=12 if hero=="mortarion_current" else 11
          if (summary.get("status")!="experimental_unqualified"
              or summary.get("eligible_for_current_statistics")!=0
              or summary.get("attempted")!=12
              or summary.get("engine_error_count")!=0
              or summary.get("completed")!=expected
              or summary.get("replay_verified")!=expected):
              raise ValueError("Source is not the pinned 12-game experimental sample")
          panel=json.loads((root/"source/panel/full-enrichment.json").read_text())
          locked=json.loads(Path("data/gorge_initial_trial_opponents_v1.json").read_text())
          if panel.get("oracle_bulk_sha256")!=locked.get("source_oracle_sha256"):
              raise ValueError("Pinned Oracle source mismatch")
          runs=[json.loads(line) for line in (src/"runs.jsonl").read_text().splitlines()
                if line.strip()]
          if len(runs)!=12 or len({r.get("seed") for r in runs})!=12:
              raise ValueError("Unexpected source game count or repeated seed")
          approved_for_archive=[]
          for game in runs:
              if game.get("error") or "cohort_id" in game:
                  raise ValueError("Unapproved cohort or engine error")
              source=src/"native"/f"gorge-seed-{game['seed']}.json"
              if not source.is_file():
                  raise ValueError("Missing authoritative source trace")
              # Preserve ALL native evidence, including the unfinished Magnus
              # turn-cap recording, while never including that game in Parquet.
              (dest/"native"/source.name).write_bytes(source.read_bytes())
              if not game.get("finished"):
                  if game.get("stall_reason")!="turns" or game.get("replay_verified"):
                      raise ValueError("Unexpected unfinished game")
                  continue
              if game.get("replay_verified") is not True:
                  raise ValueError("Unverified finished game")
              approved_for_archive.append(game)
          if len(approved_for_archive)!=expected:
              raise ValueError("Finished source count differs from qualification")
          (dest/"runs.jsonl").write_text("".join(
              json.dumps(r,sort_keys=True,separators=(",",":"))+"\n"
              for r in approved_for_archive))
          (dest/"native"/"qualification-summary.json").write_bytes(
              (src/"qualification-summary.json").read_bytes())
          (dest/"native"/"all-runs.jsonl").write_bytes(
              (src/"runs.jsonl").read_bytes())
          print(f"{hero}: {expected} source-verified completed experimental records")
          PY
      - name: Convert into immutable private experimental warehouse shard
        run: |
          python -m pip install --disable-pip-version-check 'pyarrow==21.0.0'
          python -m tools.gorge_warehouse_export \
            --shard-folder "$RUNNER_TEMP/verified" \
            --out "$RUNNER_TEMP/warehouse" --batch-id "$BATCH" \
            --deck "$HERO" --shard 0
          python - <<'PY'
          import json,os
          from pathlib import Path
          import pyarrow.parquet as pq
          f=Path(os.environ["RUNNER_TEMP"])/"warehouse"
          manifest=json.loads((f/"manifest.json").read_text())
          game=pq.read_table(f/"games.parquet",
              columns=["cohort_id","event_start_row","native_event_count"])
          if any(x is not None for x in game["cohort_id"].to_pylist()):
              raise ValueError("Experimental games cannot receive a cohort ID")
          offsets=game["event_start_row"].to_pylist()
          lengths=game["native_event_count"].to_pylist()
          if not lengths or offsets[0]!=0 or any(
              offsets[i+1]!=offsets[i]+lengths[i] for i in range(len(lengths)-1)
          ) or offsets[-1]+lengths[-1]!=manifest["native_events"]:
              raise ValueError("Untrusted event offsets")
          print("Verified private experimental event windows and no cohort approval")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real ZSTD Parquet game-window reads with Worker decoder
        working-directory: workers/gorge-r2-api
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import path from "node:path";
          import { asyncBufferFromFile, parquetReadObjects } from "hyparquet";
          import { compressors } from "hyparquet-compressors";
          import { approvedEventWindow, approvedEventSegments } from "./core.mjs";
          const dir=path.join(process.env.RUNNER_TEMP,"warehouse");
          const games=await parquetReadObjects({
            file:await asyncBufferFromFile(path.join(dir,"games.parquet")),
            columns:["game_id","event_start_row","native_event_count"],
            compressors
          });
          assert.ok(games.length>=11);
          const game=games.at(-1);
          const meta=await import("node:fs/promises");
          const manifest=JSON.parse(await meta.readFile(path.join(dir,"manifest.json"),"utf8"));
          const window=approvedEventWindow({
            event_start_row:Number(game.event_start_row),
            native_event_count:Number(game.native_event_count)
          },manifest.files["events.parquet"].rows);
          const rows=await parquetReadObjects({
            file:await asyncBufferFromFile(path.join(dir,"events.parquet")),
            columns:["game_id","seq","kind_id","secret"],
            rowStart:window.rowStart,rowEnd:window.rowEnd,compressors
          });
          assert.equal(rows.length,window.count);
          assert.ok(rows.every(e=>e.game_id===game.game_id));
          const projection=approvedEventSegments(rows.map(e=>({
            game_id:e.game_id,seq:Number(e.seq),
            kind_id:Number(e.kind_id),secret:e.secret
          })),game.game_id);
          assert.equal(projection.event_count,window.count);
          assert.equal(projection.raw_events_exposed,false);
          console.log("Source-backed hyparquet game-window round trip:", window.count,"events");
          JS
      - name: Preserve private immutable recordings and Parquet, manifest last
        shell: bash
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="$ACCESS"
          export AWS_SECRET_ACCESS_KEY="$SECRET"
          export AWS_DEFAULT_REGION=auto
          endpoint="https://$ACCOUNT.r2.cloudflarestorage.com"
          root="warehouse/v1/$BATCH/$HERO/0"
          native="native/experimental/v1/$BATCH/$HERO"
          # A previously completed immutable archive is an expected retry case.
          # Confirm the exact bytes of BOTH prefixes before treating it as done.
          warehouse_count="$(aws --endpoint-url "$endpoint" s3api list-objects-v2 \
            --bucket gorge-simulations --prefix "$root/" \
            --query KeyCount --output text)"
          native_count="$(aws --endpoint-url "$endpoint" s3api list-objects-v2 \
            --bucket gorge-simulations --prefix "$native/" \
            --query KeyCount --output text)"
          if [[ "$warehouse_count" != "0" || "$native_count" != "0" ]]; then
            mkdir -p "$RUNNER_TEMP/remote-warehouse" "$RUNNER_TEMP/remote-native"
            aws --endpoint-url "$endpoint" s3 cp \
              "s3://gorge-simulations/$root/" "$RUNNER_TEMP/remote-warehouse/" \
              --recursive --no-progress
            aws --endpoint-url "$endpoint" s3 cp \
              "s3://gorge-simulations/$native/" "$RUNNER_TEMP/remote-native/" \
              --recursive --no-progress
            python - <<'PY'
          import hashlib,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          for label,expected,actual in (
            ("warehouse",root/"warehouse",root/"remote-warehouse"),
            ("native",root/"verified/native",root/"remote-native"),
          ):
              def files(directory):
                  return {p.relative_to(directory).as_posix():
                      hashlib.sha256(p.read_bytes()).hexdigest()
                      for p in directory.rglob("*") if p.is_file()}
              want,found=files(expected),files(actual)
              if want!=found:
                  missing=sorted(set(want)-set(found))
                  extra=sorted(set(found)-set(want))
                  changed=sorted(k for k in set(want)&set(found)
                                 if want[k]!=found[k])
                  raise SystemExit(
                      f"R2 {label} immutable archive differs: "
                      f"missing={missing}, extra={extra}, changed={changed}. "
                      "No overwrite or repair attempted; investigate source.")
              print(f"Verified existing {label}: {len(want)} exact SHA-256 matches")
          PY
            echo "Existing R2 archive matches exact pinned source bytes; no writes performed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          aws --endpoint-url "$endpoint" s3 cp "$RUNNER_TEMP/verified/native/" \
            "s3://gorge-simulations/$native/" --recursive --no-progress
          aws --endpoint-url "$endpoint" s3 cp "$RUNNER_TEMP/warehouse/" \
            "s3://gorge-simulations/$root/" --recursive --exclude manifest.json --no-progress
          # Manifest is the commit marker; no API approval is inferred.
          aws --endpoint-url "$endpoint" s3 cp \
            "$RUNNER_TEMP/warehouse/manifest.json" \
            "s3://gorge-simulations/$root/manifest.json" --no-progress
          echo "Archived source-verified $HERO experiment in private R2; no cohort approved." >> "$GITHUB_STEP_SUMMARY"
