name: Commander simulator regression tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run all versioned stdlib test suites
        run: python run_all_tests.py
      - name: Test Commander bracket evaluator
        run: node --test tests/pages_brackets.test.cjs
