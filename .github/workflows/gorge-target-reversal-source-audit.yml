name: Attribute target aborts to reversed Gorge objects
on:
  push:
    branches: [test/gorge-four-commander-token-qualification-20261106]
    paths: [".github/workflows/gorge-target-reversal-source-audit.yml","tools/gorge_target_reversal_attribution.py"]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        hero: [mortarion_current, magnus_premium, necron_dynasties, wretched_ranks]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download exact recorded qualifier games
        env:
          GH_TOKEN: ${{ github.token }}
          HERO: ${{ matrix.hero }}
        run: |
          mkdir -p "$RUNNER_TEMP/native"
          gh run download 42297372712 --repo "$GITHUB_REPOSITORY" \
            --name "gorge-rule-requalification-$HERO" --dir "$RUNNER_TEMP/native"
      - name: Associate aborted target decision with reversed card
        env:
          HERO: ${{ matrix.hero }}
        run: |
          python -m tools.gorge_target_reversal_attribution --root "$RUNNER_TEMP/native" --hero "$HERO"
