name: ARCHIVED Python · Generic provisional import and partial simulation regression
# ARCHIVED: no automatic Python game simulations after gorge-only cutover.
# Older workflows can be reproduced from the preserved archive branch.
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  source-pinned-partial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate provisional grammar and real physical effects
        run: python -m unittest tests.test_provisional_import -v
      - name: Audit all deck imports, no physical effects inferred from names
        run: |
          python tools/audit_provisional_import.py --all --output /tmp/provisional-import-audit.json >/tmp/report.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/report.json"))
          for deck,report in data.items():
              print("PROVISIONAL_IMPORT",json.dumps({
                  "deck":deck,"total":report["total_cards"],
                  "status":report["counts"],
                  "kinds":report["provisional_kinds"]},
                  sort_keys=True))
          PY
      - name: Audit typed library action reuse in pinned decks
        run: |
          python tools/audit_library_recipes.py --all --output /tmp/library-recipes.json >/dev/null
          python - <<'PY'
          import json
          data=json.load(open("/tmp/library-recipes.json"))
          for deck,report in data.items():
              print("LIBRARY_RECIPES",json.dumps({
                  "deck":deck,"cards":report["cards_with_recipes"],
                  "uses":report["recipe_uses"],"sources":report["by_source"]
              },sort_keys=True))
          PY
      - name: Physical turn smoke, explicit opt-in
        run: |
          python -m commander_sim.early_game_runner --deck wretched_ranks --seed 2 --turns 3 --provisional-mode safe >/tmp/physical-provisional.json
          python - <<'PY'
          import json
          r=json.load(open("/tmp/physical-provisional.json"))
          print("PROVISIONAL_TURN_SMOKE",json.dumps({
              "deck":r["deck_key"],
              "mode":r["provisional_mode"],
              "turns":r["completed_turns"],
              "events":sum(len(t["events"]) for t in r["events"]),
              "candidate_profiles":sum(
                  p["status"]=="provisional" for p in r["provisional_import_report"])
          },sort_keys=True))
          PY
      - name: Compare opt-in partial actions across four commanders
        run: |
          python tools/run_provisional_four_decks.py --seeds 5 --turns 5 --output /tmp/provisional-four-deck-comparison.json
      - uses: actions/upload-artifact@v4
        with:
          name: generic-provisional-import-example
          path: |
            /tmp/library-recipes.json
            /tmp/provisional-import-audit.json
            /tmp/provisional-four-deck-comparison.json
          retention-days: 14
