name: Gorge Mortarion four-pilot strategy benchmark
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gorge-mortarion-four-pilots.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gorge-mortarion-four-pilots
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Retrieve fixed deck and corpus, rebuild corrected Gorge probe
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bundle"
          gh run download 41938112091 --name gorge-500-pinned-bundle --dir "$RUNNER_TEMP/bundle"
          test -d "$RUNNER_TEMP/bundle/.cards"
          test -f "$RUNNER_TEMP/bundle/pods/mortarion_current-pod.json"
          git clone --filter=blob:none https://github.com/adams-shaun/gorge.git "$RUNNER_TEMP/gorge"
          git -C "$RUNNER_TEMP/gorge" checkout --detach b78e4c8b16078f6decbc48875bba953ce5535b85
          cp tools/gorge_commander_probe.go "$RUNNER_TEMP/gorge/commander_probe.go"
          (cd "$RUNNER_TEMP/gorge" && go build -o "$RUNNER_TEMP/bundle/gorge-probe" ./commander_probe.go)
          chmod +x "$RUNNER_TEMP/bundle/gorge-probe"
      - uses: actions/upload-artifact@v4
        with:
          name: mortarion-four-pilot-pinned-bundle
          path: ${{ runner.temp }}/bundle/
          include-hidden-files: true
          retention-days: 3

  simulate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        policy: [bot, forge-heuristic, forge-heuristic-hold, lethal-pressure]
    env:
      POLICY: ${{ matrix.policy }}
      R2_ACCOUNT_ID: ${{ secrets.GORGE_R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.GORGE_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.GORGE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mortarion-four-pilot-pinned-bundle
          path: ${{ runner.temp }}/bundle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run 100 real Gorge games and save all native traces
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/results"
          mkdir -p "$root/native"
          opponents="$(python -c 'import json,sys;print(",".join(json.load(open(sys.argv[1]))["opponent_pool"]))' "$RUNNER_TEMP/bundle/pods/mortarion_current-pod.json")"
          "$RUNNER_TEMP/bundle/gorge-probe" \
            -corpus "$RUNNER_TEMP/bundle/.cards" \
            -deck-dir "$RUNNER_TEMP/bundle/decks" \
            -hero-deck mortarion_current -opponents "$opponents" \
            -games 100 -seed 99000 -max-turns 60 \
            -retry-unverified=true -max-attempts 500 \
            -pilot bot -hero-pilot "$POLICY" -verify=true \
            -native-dir "$root/native" -native-limit 100 \
            > "$root/runs.jsonl"
          python -m tools.gorge_mortarion_pilot_strategy \
            --folder "$root" --policy "$POLICY" --out "$root/strategy.json"
      - name: Store source recordings privately in R2
        shell: bash
        run: |
          set -euo pipefail
          test -n "$R2_ACCOUNT_ID" && test -n "$R2_ACCESS_KEY_ID" && test -n "$R2_SECRET_ACCESS_KEY"
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_DEFAULT_REGION=auto
          tar -czf "$RUNNER_TEMP/native-$POLICY.tar.gz" -C "$RUNNER_TEMP/results" native runs.jsonl strategy.json
          aws --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" s3 cp \
            "$RUNNER_TEMP/native-$POLICY.tar.gz" \
            "s3://gorge-simulations/pilot-evaluations/v1/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/$POLICY.tar.gz" --no-progress
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mortarion-four-pilot-${{ matrix.policy }}
          path: ${{ runner.temp }}/results/strategy.json
          retention-days: 14
          if-no-files-found: warn

  compare:
    needs: simulate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: mortarion-four-pilot-*
          path: ${{ runner.temp }}/pilots
          merge-multiple: false
      - name: Normalize policy directories and compare matched game outcomes
        shell: bash
        run: |
          set -euo pipefail
          for policy in bot forge-heuristic forge-heuristic-hold lethal-pressure; do
            mkdir -p "$RUNNER_TEMP/policies/$policy"
            cp "$RUNNER_TEMP/pilots/mortarion-four-pilot-$policy/strategy.json" "$RUNNER_TEMP/policies/$policy/strategy.json"
          done
          python -m tools.gorge_mortarion_pilot_compare \
            --root "$RUNNER_TEMP/policies" --out "$RUNNER_TEMP/comparison.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads((Path(os.environ["RUNNER_TEMP"])/"comparison.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("# Mortarion four-pilot matched-seed benchmark\n\n")
              f.write(f"Shared verified seeds across all four policies: **{report['shared_seed_count']}**.\n\n")
              f.write("| Pilot | Wins/100 | Astartes games | Astartes tokens | Pestilence + Astartes games |\n|---|---:|---:|---:|---:|\n")
              for name,p in report["policies"].items():
                  f.write(f"| {name} | {p['wins']} | {p['astartes_games']} | {p['astartes_token_events']} | {p['pestilence_and_astartes_games']} |\n")
              f.write("\nMatched exploratory comparisons against default bot (exact McNemar; unadjusted):\n\n")
              for name,p in report["pairwise_to_default"].items():
                  f.write(f"- {name}: {p['matched_win_rate_difference']*100:+.1f} pp; p={p['mcnemar_exact_two_sided_p']} (n={p['matched_games']})\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mortarion-four-pilot-comparison
          path: ${{ runner.temp }}/comparison.json
          retention-days: 14
