name: Gorge R2 connection smoke test
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gorge-r2-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      R2_ACCOUNT_ID: ${{ secrets.GORGE_R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.GORGE_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.GORGE_R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Verify restricted credentials and private archive bucket
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$R2_ACCOUNT_ID" || -z "$R2_ACCESS_KEY_ID" || -z "$R2_SECRET_ACCESS_KEY" ]]; then
            echo "::error::Missing one or more GORGE_R2_* repository secrets"
            exit 1
          fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto
          endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          key="connection-tests/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          payload="$RUNNER_TEMP/r2-connection-test.txt"
          received="$RUNNER_TEMP/r2-connection-test-received.txt"
          printf 'Gorge archive connection test %s/%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$payload"
          aws --endpoint-url "$endpoint" s3 cp "$payload" "s3://gorge-simulations/$key" --no-progress
          trap 'aws --endpoint-url "$endpoint" s3 rm "s3://gorge-simulations/$key" >/dev/null || true' EXIT
          aws --endpoint-url "$endpoint" s3 cp "s3://gorge-simulations/$key" "$received" --no-progress
          cmp "$payload" "$received"
          aws --endpoint-url "$endpoint" s3 rm "s3://gorge-simulations/$key"
          trap - EXIT
          echo "R2 upload, readback, and cleanup succeeded." >> "$GITHUB_STEP_SUMMARY"
