name: Test direct R2 Gorge Worker
on:
  pull_request:
    paths:
      - "workers/gorge-r2-api/**"
      - ".github/workflows/gorge-r2-worker-check.yml"
      - ".github/workflows/gorge-r2-worker-deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate read-only Worker and ZSTD Parquet bundling
        working-directory: workers/gorge-r2-api
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          npm run check
