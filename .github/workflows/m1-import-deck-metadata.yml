name: Explicit M1 deck metadata import
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/m1-import-once.trigger"
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: explicit-m1-import
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Explicitly fetch only uncached names and validate six decks
        run: |
          python tools/import_deck_fixtures.py --fetch-missing \
            --report simulator/card_data/m1_import_report.json
      - name: Verify full historical and M1 regression suite
        run: python run_all_tests.py
      - name: Commit immutable cache and deck-specific snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulator/card_data/shared_scryfall_catalog.json
          git add simulator/card_data/*_m1_scryfall.json simulator/card_data/*_m1_scryfall.manifest.json
          git add simulator/card_data/m1_import_report.json
          if ! git diff --cached --quiet; then
            git commit -m "M1: pin verified six-deck metadata from explicit cache-first Scryfall import"
            git push origin HEAD:main
          fi
