name: Rehearse materialized Results publication and rollback in isolated R2 staging
on:
  push:
    branches: [stage/r2-full-state-rehearsal-20261106]
    paths: [".github/workflows/gorge-r2-materialized-staging-smoke.yml"]
  workflow_dispatch:
    inputs:
      confirm_staging_only:
        description: "I confirm only an isolated per-run staging prefix may be modified"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: gorge-materialized-staging-rehearsal
  cancel-in-progress: false
jobs:
  rehearse:
    if: (github.event_name == 'workflow_dispatch' && inputs.confirm_staging_only == true) || (github.event_name == 'push' && github.ref == 'refs/heads/stage/r2-full-state-rehearsal-20261106')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ACCOUNT: ${{ secrets.GORGE_R2_ACCOUNT_ID }}
      ACCESS: ${{ secrets.GORGE_R2_ACCESS_KEY_ID }}
      SECRET: ${{ secrets.GORGE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Parquet reader
        run: pip install 'pyarrow==21.0.0'
      - name: Download source only; validate explicitly approved shard inventory
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ACCOUNT" && test -n "$ACCESS" && test -n "$SECRET"
          export AWS_ACCESS_KEY_ID="$ACCESS" AWS_SECRET_ACCESS_KEY="$SECRET" AWS_DEFAULT_REGION=auto
          endpoint="https://$ACCOUNT.r2.cloudflarestorage.com"
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/inventory"
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path('data/gorge_r2_source_inventory_v1.json').read_text())
          batches=sorted(b['batch'] for b in data['batches'])
          Path(os.environ['RUNNER_TEMP'],'inventory','batches.txt').write_text('\n'.join(batches)+'\n')
          PY
          while IFS= read -r batch; do
            aws --endpoint-url "$endpoint" s3 cp \
              "s3://gorge-simulations/warehouse/v1/$batch/" \
              "$RUNNER_TEMP/source/$batch/" --recursive --no-progress \
              --exclude "*" --include "*/manifest.json" \
              --include "*/games.parquet" --include "*/events.parquet" \
              --include "*/ui-original.v1.json"
          done < "$RUNNER_TEMP/inventory/batches.txt"
          python -m tools.gorge_r2_source_inventory \
            --inventory data/gorge_r2_source_inventory_v1.json \
            --registry data/gorge_analytics_cohort_registry_v1.json \
            --batches-file "$RUNNER_TEMP/inventory/batches.txt" \
            --out "$RUNNER_TEMP/inventory/shards.json"
      - name: Reconstruct omniscient projections and full-cohort native insights from original recordings
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          inventory=json.loads(Path('data/gorge_r2_source_inventory_v1.json').read_text())
          assert len(inventory['batches'])==1 and inventory['batches'][0]['batch']=='42143344243-1'
          assert {(s['deck'],s['shard'],s['games']) for s in inventory['batches'][0]['shards']}=={
              ('mortarion_current',0,12),('magnus_premium',0,12)}
          PY
          batch="42143344243-1"
          for deck in mortarion_current magnus_premium; do
            src="$RUNNER_TEMP/native/$deck"
            dest="$RUNNER_TEMP/source/$batch/$deck/0"
            mkdir -p "$src" "$dest"
            gh run download 42143344243 --repo "$GITHUB_REPOSITORY" \
              --name "gorge-corrected-fresh-candidate-$deck" --dir "$src"
            test -f "$src/results/source-manifest.json"
            test -f "$src/results/runs.jsonl"
            test -d "$src/results/native"
            deck_sha="$(DECK="$deck" python - <<'PY'
          import json,os
          catalog=json.load(open('docs/deck-lab/decks.json'))
          print(next(d['deck_sha256'] for d in catalog['decks'] if d['key']==os.environ['DECK']))
          PY
          )"
            cp "$dest/ui-original.v1.json" "$RUNNER_TEMP/inventory/prior-$deck-ui.json"
            python -m tools.gorge_original_ui_shard \
              --source-dir "$src/results" --deck "$deck" \
              --batch "$batch" --shard 0 --ui-deck-sha "$deck_sha" \
              --out "$dest/ui-original.v1.json"
            DECK="$deck" DEST="$dest" python - <<'PY'
          import json,os
          from pathlib import Path
          deck=os.environ['DECK']
          dest=Path(os.environ['DEST'])
          projection=json.loads((dest/'ui-original.v1.json').read_text())
          assert projection['deck']==deck and len(projection['games'])==12
          for entry in projection['games']:
              run=entry['run']
              assert run['gorge_source']['visibility']=='omniscient'
              assert run['gorge_source']['synthetic_simulation_only'] is True
              assert len(run['opening_hand'])==run['opening_hand_count']
              assert len(run['opening_hands_by_seat'])==3
              assert run['gorge_source']['opening_hand_boundary']=='first_pending_decision_of_turn'
              assert all(isinstance(o['hand'],list) and isinstance(o['opponent_hands'],list)
                         for o in run['ui_observations'])
              assert all(s.get('library') is not None
                         for s in run['opening_board_states'])
          print('PASS: native omniscient source-derived 12-game projection',deck)
          PY
            DECK="$deck" DEST="$dest" SOURCE="$src/results" python - <<'PY'
          import json,os
          from pathlib import Path
          folder=Path(os.environ["SOURCE"])
          projection=json.loads((Path(os.environ["DEST"])/"ui-original.v1.json").read_text())
          for entry in projection["games"]:
              bad=[(o["turn"], a.get("type"), a.get("seat"), a.get("native_turn"),
                    a.get("native_turn_seat"), a.get("source_seq"))
                   for o in entry["run"]["ui_observations"]
                   for a in o.get("actions",[]) if a.get("card")=="Exclude"]
              if not bad: continue
              trace=json.loads((folder/"native"/f"gorge-seed-{entry['run']['seed']}.json").read_text())
              active=None
              native=[]
              for event in trace["log"]["events"]:
                  if event["kind"]==9: active=event.get("player")
                  if event["kind"]==11 and event.get("text")=="Exclude":
                      native.append({"seq":event.get("seq"),"player":event.get("player"),
                                     "turn_active":active,"obj":event.get("obj")})
              print("DIAGNOSTIC opponent Exclude",os.environ["DECK"],
                    "seed",entry["run"]["seed"],"hero",entry["run"]["gorge_source"]["original_seat"],
                    "adapter",bad,"native_casts",native)
          PY
            python -m tools.gorge_r2_insight_evidence \
              --native-source "$src/results" --shard "$dest" \
              --out "$dest/card-insights.v2.json"
          done
      - name: Materialize complete approved snapshot and earlier staging-only subset
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.gorge_r2_materialized_results \
            --source "$RUNNER_TEMP/source" \
            --registry data/gorge_analytics_cohort_registry_v1.json \
            --expected-batches-file "$RUNNER_TEMP/inventory/batches.txt" \
            --expected-shards-file "$RUNNER_TEMP/inventory/shards.json" \
            --out "$RUNNER_TEMP/complete"
          mkdir -p "$RUNNER_TEMP/source-old"
          python - <<'PY'
          import json,os,shutil
          from pathlib import Path
          tmp=Path(os.environ['RUNNER_TEMP'])
          inventory=json.loads((tmp/'inventory/shards.json').read_text())
          first=inventory[0]
          src=tmp/'source'/first['batch']/first['deck']/first['shard']
          if not src.is_dir(): raise ValueError('Missing rehearsal source shard')
          dst=tmp/'source-old'/first['batch']/first['deck']/first['shard']
          shutil.copytree(src,dst)
          PY
          # Staging-only predecessor is deliberately limited to one approved shard,
          # to exercise a genuine version change. Never publish it in production.
          python -m tools.gorge_r2_materialized_results \
            --source "$RUNNER_TEMP/source-old" \
            --registry data/gorge_analytics_cohort_registry_v1.json \
            --out "$RUNNER_TEMP/previous"
      - name: Upload and verify two immutable versions; exercise pointer-last rollback
        shell: bash
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="$ACCESS" AWS_SECRET_ACCESS_KEY="$SECRET" AWS_DEFAULT_REGION=auto
          endpoint="https://$ACCOUNT.r2.cloudflarestorage.com"
          # Unique staging prefix; never use results/materialized/v1/current.json.
          prefix="s3://gorge-simulations/results/materialized/staging/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          old="$(python -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/previous/current.json"))["version"])')"
          new="$(python -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/complete/current.json"))["version"])')"
          test "$old" != "$new"
          for stage in previous complete; do
            if [ "$stage" = previous ]; then version="$old"; else version="$new"; fi
            aws --endpoint-url "$endpoint" s3 cp \
              "$RUNNER_TEMP/$stage/versions/$version/" "$prefix/versions/$version/" \
              --recursive --no-progress
            mkdir -p "$RUNNER_TEMP/readback/versions/$version"
            aws --endpoint-url "$endpoint" s3 cp \
              "$prefix/versions/$version/" "$RUNNER_TEMP/readback/versions/$version/" \
              --recursive --no-progress
            diff -qr "$RUNNER_TEMP/$stage/versions/$version" \
              "$RUNNER_TEMP/readback/versions/$version"
          done
          aws --endpoint-url "$endpoint" s3 cp \
            "$RUNNER_TEMP/previous/current.json" "$prefix/current.json" \
            --content-type application/json --cache-control no-store --no-progress
          aws --endpoint-url "$endpoint" s3 cp "$prefix/current.json" \
            "$RUNNER_TEMP/current-old.json" --no-progress
          cmp "$RUNNER_TEMP/previous/current.json" "$RUNNER_TEMP/current-old.json"
          aws --endpoint-url "$endpoint" s3 cp \
            "$RUNNER_TEMP/complete/current.json" "$prefix/current.json" \
            --content-type application/json --cache-control no-store --no-progress
          aws --endpoint-url "$endpoint" s3 cp "$prefix/current.json" \
            "$RUNNER_TEMP/current-new.json" --no-progress
          cmp "$RUNNER_TEMP/complete/current.json" "$RUNNER_TEMP/current-new.json"
          python -m tools.gorge_r2_materialized_rollback \
            --download "$RUNNER_TEMP/readback" \
            --registry data/gorge_analytics_cohort_registry_v1.json \
            --current "$RUNNER_TEMP/current-new.json" \
            --expected-current "$new" --target-version "$old" \
            --output "$RUNNER_TEMP/rollback.json"
          aws --endpoint-url "$endpoint" s3 cp \
            "$RUNNER_TEMP/rollback.json" "$prefix/current.json" \
            --content-type application/json --cache-control no-store --no-progress
          aws --endpoint-url "$endpoint" s3 cp "$prefix/current.json" \
            "$RUNNER_TEMP/rolled-back.json" --no-progress
          cmp "$RUNNER_TEMP/rollback.json" "$RUNNER_TEMP/rolled-back.json"
          echo "SUCCESS: isolated R2 staging publish $old -> $new -> rollback $old" >> "$GITHUB_STEP_SUMMARY"
          echo "Staging prefix: results/materialized/staging/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/" >> "$GITHUB_STEP_SUMMARY"
