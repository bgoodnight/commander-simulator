name: Publish verified Gorge UI artifact to Pages data

# Deliberately separate from simulation execution and conversion. A publication
# retry never reruns a game; only independently verified converted data ships.
on:
  workflow_dispatch:
    inputs:
      conversion_run_id:
        description: "Successful Gorge results conversion workflow run ID"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: gorge-results-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download validated replay-only artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.conversion_run_id }}
        run: |
          case "$RUN_ID" in *[!0-9]*|'') echo "Invalid conversion run ID"; exit 1;; esac
          gh run download "$RUN_ID" --name gorge-ui-publication --dir "$RUNNER_TEMP/public_ui"
      - name: Verify public catalog and copy allowlisted data
        env:
          PUBLIC_SOURCE: ${{ runner.temp }}/public_ui
        run: |
          python - <<'PY'
          import json,os,re,hashlib,shutil
          from pathlib import Path
          from tools.gorge_results_pipeline import public_replay_is_safe
          source=Path(os.environ["PUBLIC_SOURCE"])
          manifest=json.loads((source/"manifest.json").read_text())
          analytics=json.loads((source/"analytics.json").read_text())
          assert manifest["schema"]=="gorge-omniscient-replay-manifest-v1"
          assert manifest["visibility"]=="omniscient"
          assert manifest["synthetic_simulation_only"] is True
          assert analytics["schema"]=="gorge-batch-analytics-v1"
          assert 1<=len(manifest["games"])<=500
          allowed={"manifest.json","analytics.json"}
          for entry in manifest["games"]:
              name=entry["file"]
              assert re.fullmatch(r"gorge-seed-[0-9]+\.ui\.json",name)
              assert name not in allowed
              allowed.add(name)
              raw=(source/name).read_bytes()
              if "ui_sha256" in entry:
                  assert hashlib.sha256(raw).hexdigest()==entry["ui_sha256"]
              assert public_replay_is_safe(json.loads(raw),entry)
          assert {p.name for p in source.iterdir()}==allowed
          for target in (Path("web/pages/data/gorge"),):
              target.mkdir(parents=True,exist_ok=True)
              for name in allowed: shutil.copyfile(source/name,target/name)
          print(f"Validated {len(manifest['games'])} public replays")
          PY
          python -m tools.build_pages_deck_lab --output "$RUNNER_TEMP/pages-verify" > /dev/null
      - name: Commit catalog to repository, independently of Pages deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A web/pages/data/gorge/
          if git diff --cached --quiet; then
            echo "No changed public replays" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Publish validated Gorge replay catalog and analytics"
          git push origin HEAD:main
          echo "Public Gorge catalog committed; Pages deployment proceeds independently." >> "$GITHUB_STEP_SUMMARY"
