name: Archive original Results projections from verified Gorge recordings
# This publishes ONLY private experimental UI projections, never approved
# warehouse data, analytics, Pages statistics or cohort registry changes.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: gorge-original-ui-private-archive-42143344243-1
  cancel-in-progress: false
jobs:
  archive:
    name: Source-verified private UI archive (${{ matrix.hero }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        hero: [mortarion_current, magnus_premium]
    env:
      ACCOUNT: ${{ secrets.GORGE_R2_ACCOUNT_ID }}
      ACCESS: ${{ secrets.GORGE_R2_ACCESS_KEY_ID }}
      SECRET: ${{ secrets.GORGE_R2_SECRET_ACCESS_KEY }}
      SOURCE_BATCH: "42143344243-1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require existing R2 credentials; never expose source secrets
        run: |
          test -n "$ACCOUNT" && test -n "$ACCESS" && test -n "$SECRET"
      - name: Retrieve pinned corrected-pilot evidence for exact hero
        env:
          GH_TOKEN: ${{ github.token }}
          HERO: ${{ matrix.hero }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-source"
          gh run download 42143344243 --repo "$GITHUB_REPOSITORY" \
            --name "gorge-corrected-fresh-candidate-$HERO" --dir "$RUNNER_TEMP/native-source"
          test -f "$RUNNER_TEMP/native-source/results/source-manifest.json"
      - name: Generate all-seat omniscient UI projection locally from complete native evidence
        env:
          HERO: ${{ matrix.hero }}
        shell: bash
        run: |
          set -euo pipefail
          deck_sha="$(python -c 'import json,os; doc=json.load(open("docs/deck-lab/decks.json")); print(next(x["deck_sha256"] for x in doc["decks"] if x["key"]==os.environ["HERO"]))')"
          mkdir -p "$RUNNER_TEMP/ui"
          python -m tools.gorge_original_ui_shard \
            --source-dir "$RUNNER_TEMP/native-source/results" \
            --deck "$HERO" --batch "$SOURCE_BATCH" --shard 0 \
            --ui-deck-sha "$deck_sha" \
            --out "$RUNNER_TEMP/ui/ui-original.v1.json"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          ui=Path(os.environ["RUNNER_TEMP"])/"ui"
          projection=json.loads((ui/"ui-original.v1.json").read_text())
          source=Path(os.environ["RUNNER_TEMP"])/"native-source/results/source-manifest.json"
          if projection["source_batch"]!=os.environ["SOURCE_BATCH"] or len(projection["games"])!=12:
              raise ValueError("Incomplete or mismatched experimental UI projection")
          info={
              "schema":"gorge-r2-private-experimental-ui-archive-v2",
              "approval":False,"production_eligible":False,
              "source_batch":projection["source_batch"],
              "hero":projection["deck"],"game_count":len(projection["games"]),
              "source_manifest_sha256":hashlib.sha256(source.read_bytes()).hexdigest(),
              "ui_projection_sha256":hashlib.sha256((ui/"ui-original.v1.json").read_bytes()).hexdigest()
          }
          (ui/"archive-audit.json").write_text(json.dumps(info,sort_keys=True)+"\n")
          PY
      - name: Store immutable private R2 projection with exact retry comparison
        env:
          HERO: ${{ matrix.hero }}
        shell: bash
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="$ACCESS" AWS_SECRET_ACCESS_KEY="$SECRET" AWS_DEFAULT_REGION=auto
          endpoint="https://$ACCOUNT.r2.cloudflarestorage.com"
          prefix="ui/experimental/corrected-pilot/v2/$SOURCE_BATCH/$HERO"
          for filename in ui-original.v1.json archive-audit.json; do
            path="$RUNNER_TEMP/ui/$filename"
            key="$prefix/$filename"
            if aws --endpoint-url "$endpoint" s3api head-object \
                --bucket gorge-simulations --key "$key" >/dev/null 2>&1; then
              aws --endpoint-url "$endpoint" s3 cp \
                "s3://gorge-simulations/$key" "$RUNNER_TEMP/existing-$filename" --no-progress
              cmp "$path" "$RUNNER_TEMP/existing-$filename" || {
                echo "::error::Immutable R2 projection differs at $key"; exit 1;
              }
              echo "Verified unchanged R2 $filename"
            else
              aws --endpoint-url "$endpoint" s3 cp "$path" \
                "s3://gorge-simulations/$key" --no-progress
            fi
          done
          echo "Private experimental original UI projection archived: $prefix" >> "$GITHUB_STEP_SUMMARY"
          echo "The public Worker does not read this private prefix or approve these games." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-original-ui-archive-audit-${{ matrix.hero }}
          path: ${{ runner.temp }}/ui/archive-audit.json
          if-no-files-found: warn
          retention-days: 7
