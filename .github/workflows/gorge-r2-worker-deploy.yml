name: Deploy private-bucket Gorge R2 read-only Worker
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Require Cloudflare Workers API token and account ID
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.GORGE_R2_ACCOUNT_ID }}
        run: |
          test -n "$TOKEN" || { echo "CLOUDFLARE_API_TOKEN secret missing"; exit 1; }
          test -n "$ACCOUNT" || { echo "GORGE_R2_ACCOUNT_ID secret missing"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install reproducible Worker dependencies and test
        working-directory: workers/gorge-r2-api
        run: |
          npm ci --ignore-scripts --no-audit
          npm test
      - name: Deploy the read-only Worker; do not run simulations or publish Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.GORGE_R2_ACCOUNT_ID }}
          workingDirectory: workers/gorge-r2-api
          command: deploy
