name: Deploy private-bucket Gorge R2 read-only Worker
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Require Cloudflare Workers API token and account ID
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.GORGE_R2_ACCOUNT_ID }}
        run: |
          test -n "$TOKEN" || { echo "CLOUDFLARE_API_TOKEN secret missing"; exit 1; }
          test -n "$ACCOUNT" || { echo "GORGE_R2_ACCOUNT_ID secret missing"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install reproducible Worker dependencies and test
        working-directory: workers/gorge-r2-api
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
      - name: Deploy the read-only Worker; do not run simulations or publish Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.GORGE_R2_ACCOUNT_ID }}
          workingDirectory: workers/gorge-r2-api
          command: deploy
      - name: Benchmark actual R2 Parquet using a temporary private token
        working-directory: workers/gorge-r2-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.GORGE_R2_ACCOUNT_ID }}
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WORKER_URL" || { echo "Worker deployment URL unavailable"; exit 1; }
          # Prevent an automation from overwriting a user-managed benchmark secret.
          if npx wrangler secret list --format=json | node -e '
             let x="";process.stdin.on("data",d=>x+=d);process.stdin.on("end",()=>{
               if(JSON.parse(x).some(s=>s.name==="BENCHMARK_TOKEN"))process.exit(1);
             });'; then
            echo "Temporary benchmark token slot is available"
          else
            echo "::error::BENCHMARK_TOKEN already exists; refuse to replace it"
            exit 1
          fi
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          put=0
          cleanup() {
            if [[ "$put" -eq 1 ]]; then
              if ! printf 'y\n' | npx wrangler secret delete BENCHMARK_TOKEN --name gorge-r2-direct-api-preview >/dev/null; then
                echo "::error::Failed to revoke temporary BENCHMARK_TOKEN; revoke it in Cloudflare immediately."
                trap - EXIT
                exit 1
              fi
            fi
          }
          trap cleanup EXIT
          printf '%s' "$token" | npx wrangler secret put BENCHMARK_TOKEN --name gorge-r2-direct-api-preview >/dev/null
          put=1
          # Secret updates can take time to propagate across Workers isolates.
          # Authenticate before timing the benchmark so a transient 401 is not
          # confused with a Parquet decoding or R2 access failure.
          curl --fail --silent --show-error --max-time 25 "$WORKER_URL/health" >/dev/null
          ready=0
          for attempt in {1..12}; do
            code="$(curl --silent --show-error --max-time 30 --output "$RUNNER_TEMP/r2-benchmark-probe.json" --write-out '%{http_code}' \
              -H "Authorization: Bearer $token" \
              "$WORKER_URL/v1/benchmark?deck=mortarion_current")"
            if [[ "$code" == 200 ]]; then
              ready=1
              break
            fi
            if [[ "$code" != 401 ]]; then
              echo "::error::Benchmark probe returned HTTP $code, not a temporary authorization error"
              cat "$RUNNER_TEMP/r2-benchmark-probe.json"
              exit 1
            fi
            echo "Benchmark credential not yet active (HTTP 401, attempt $attempt/12)"
            sleep 5
          done
          if [[ "$ready" -ne 1 ]]; then
            echo "::error::Benchmark authentication did not become active after 12 attempts"
            exit 1
          fi
          node -e 'const x=require(process.argv[1]);if(x.status!=="ok"){console.error("Benchmark probe status:",x.status);process.exit(1)}' "$RUNNER_TEMP/r2-benchmark-probe.json"
          : > "$RUNNER_TEMP/r2-api-benchmark.jsonl"
          for i in {1..7}; do
            curl --fail --silent --show-error --retry 2 --retry-delay 2 --max-time 30 \
              -H "Authorization: Bearer $token" \
              "$WORKER_URL/v1/benchmark?deck=mortarion_current" \
              >> "$RUNNER_TEMP/r2-api-benchmark.jsonl"
            printf '\n' >> "$RUNNER_TEMP/r2-api-benchmark.jsonl"
          done
          python - <<'PY'
          import json,os,statistics,math
          from pathlib import Path
          rows=[json.loads(x) for x in
                (Path(os.environ["RUNNER_TEMP"])/"r2-api-benchmark.jsonl").read_text().splitlines()
                if x.strip()]
          if len(rows)!=7 or any(x.get("status")!="ok" for x in rows):
              raise ValueError("Benchmark did not retrieve a real Parquet shard seven times")
          fields=["listing","manifest","parquet","total"]
          values={field:[x["timing_ms"][field] for x in rows] for field in fields}
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("# R2 direct-query Worker, seven sequential real Parquet reads\n\n")
              f.write("No full Gorge traces, secrets, or private source events were exposed.\n\n")
              f.write("| Phase | Median (ms) | P95 (ms) |\n|---|---:|---:|\n")
              for field in fields:
                  a=sorted(values[field])
                  f.write(f"| {field} | {statistics.median(a):.1f} | {a[math.ceil(.95*len(a))-1]:.1f} |\n")
              f.write(f"\nGames decoded per request: **{rows[0]['rows_read']}**. ")
              f.write("These are raw diagnostic reads, not approved analytics.\n")
          print("Gorge R2 direct benchmark completed; see GitHub Step Summary")
          PY
      - name: Smoke-test public read-only API and response privacy
        working-directory: workers/gorge-r2-api
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          for deck in mortarion_current magnus_premium; do
            curl --fail --silent --show-error --max-time 30 \
              "$WORKER_URL/v1/summary?deck=$deck" > "$RUNNER_TEMP/summary-$deck.json"
            curl --fail --silent --show-error --max-time 30 \
              "$WORKER_URL/v1/games?deck=$deck&limit=5" > "$RUNNER_TEMP/games-$deck.json"
          done
          python - <<'PY'
          import json,os
          from pathlib import Path
          home=Path(os.environ["RUNNER_TEMP"])
          for deck in ("mortarion_current","magnus_premium"):
              summary=json.loads((home/f"summary-{deck}.json").read_text())
              games=json.loads((home/f"games-{deck}.json").read_text())
              assert summary["schema"]=="gorge-r2-live-summary-v1"
              assert games["schema"]=="gorge-r2-approved-game-index-v1"
              assert summary["deck"]==games["deck"]==deck
              assert summary["population"]==games["population"]=="approved_current_decisive_only"
              assert games["total"]>=len(games["games"])
              assert games["limit"]==5
              assert games["status"] in ("ready","awaiting_cohort_approval","no_warehouse_shards")
              assert summary["status"] in ("ready","awaiting_cohort_approval","no_warehouse_shards")
              for row in games["games"]:
                  assert set(row)=={"game_id","turns","result","opponent_decks"}
                  assert row["result"] in ("win","loss")
                  assert len(row["opponent_decks"])==3
              assert "event_json" not in json.dumps(games)
              print(f"{deck}: summary={summary['status']}, index={games['status']}, index_games={len(games['games'])}")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as output:
              output.write("\\n## Live public API smoke check\\n")
              output.write("Both /v1/summary and /v1/games returned validated schemas for Mortarion and Magnus.\\n")
          PY
      - name: Smoke-test individual game and native event-segment routes
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.parse,urllib.request
          base=os.environ["WORKER_URL"].rstrip("/")
          private_keys=("event_json","object_id","object_key","seed","source_sha256","intents")
          def read(route,deck):
              url=base+route+("?deck="+urllib.parse.quote(deck))
              with urllib.request.urlopen(url,timeout=30) as response:
                  assert response.status==200, response.status
                  return json.load(response)
          for deck in ("mortarion_current","magnus_premium"):
              index=read("/v1/games",deck)
              # Ineligible/historical game identities must never be retrievable.
              unknown="smoke_nonexistent_game_20261105"
              path="/v1/games/"+urllib.parse.quote(unknown,safe="")
              for suffix in ("","/timeline"):
                  result=read(path+suffix,deck)
                  assert result.get("game") is None, "Unknown game was disclosed"
                  assert result.get("status") in (
                      "game_not_found","awaiting_cohort_approval","no_warehouse_shards"
                  ),result
                  assert not any(k in json.dumps(result) for k in private_keys),result
              if index["status"]!="ready" or not index["games"]:
                  print(f"{deck}: no approved current game, negative-route checks passed")
                  continue
              # When certification makes a real game available, verify actual R2
              # event projection without ever downloading native payloads.
              game=index["games"][0]
              path="/v1/games/"+urllib.parse.quote(game["game_id"],safe="")
              detail=read(path,deck)
              timeline=read(path+"/timeline",deck)
              assert detail["status"]=="ready" and detail["game"]["game_id"]==game["game_id"]
              assert timeline["schema"]=="gorge-r2-game-timeline-v1"
              assert timeline["status"]=="ready"
              record=timeline["game"]["timeline"]
              assert record["schema"]=="gorge-r2-event-segments-v1"
              assert record["game_id"]==game["game_id"]
              assert record["raw_events_exposed"] is False
              assert record["event_count"]==sum(
                  segment["public_events"]+segment["withheld_events"]
                  for segment in record["segments"])
              assert not any(k in json.dumps(timeline) for k in private_keys)
              print(f"{deck}: verified {record['event_count']} bounded native event entries")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gorge-r2-worker-latency
          path: ${{ runner.temp }}/r2-api-benchmark.jsonl
          retention-days: 7
          if-no-files-found: warn
