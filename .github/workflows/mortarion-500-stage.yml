name: Stage and review 500 Mortarion modeled games

# Run the full batch explicitly after the pilot / rules baseline is approved.
# Workflow edits should not silently trigger 500 new games on main.
on:
  pull_request:
    paths:
      - ".github/workflows/mortarion-500-stage.yml"
      - "tools/review_game_outcomes.py"
      - "tools/validate_outcome_ui_coverage.py"
  # Only an explicit new one-time request file triggers a production batch.
  # Normal pushes and UI changes will not rerun 500 games.
  push:
    branches: [main]
    paths:
      - ".github/simulation-requests/mortarion-500-*.json"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: mortarion-500-review-${{ github.ref }}
  # Superseded PR smoke checks should not block the newest revision, but
  # never interrupt a real 500-game main-branch batch.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    name: Verify merged pilot, report and five scenario contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regress previously failing mixed seed 69
        run: |
          python tools/build_game_outcomes.py \
            --deck mortarion_physical_final \
            --scenario mixed --rounds 30 \
            --start-seed 69 --seeds 1 --examples 1 \
            --pilot-style adaptive --pilot-archetype auto \
            --provisional-mode safe \
            --output dist/mortarion-known-seed-69.json
      - name: Exercise 20 full-horizon seeds per opponent scenario
        run: |
          mkdir -p dist/mortarion-smoke
          for scenario in balanced aggressive control combo mixed; do
            python tools/build_game_outcomes.py \
              --deck mortarion_physical_final \
              --scenario "$scenario" \
              --rounds 30 --seeds 20 --examples 2 \
              --pilot-style adaptive --provisional-mode safe \
              --pilot-archetype auto \
              --output "dist/mortarion-smoke/mortarion-$scenario.json"
          done
          python tools/review_game_outcomes.py \
            --source dist/mortarion-smoke --seeds 20 --rounds 30 \
            --json-output dist/mortarion-smoke-review.json \
            --markdown-output dist/mortarion-smoke-review.md
          python tools/validate_outcome_ui_coverage.py \
            --source dist/mortarion-smoke --expected-games 20 --expected-rounds 30
      - name: Validate production publisher contracts
        run: python -m unittest tests.test_game_outcome_publishing tests.test_outcome_ui_coverage -v

  simulate:
    if: github.event_name != 'pull_request'
    name: Mortarion · ${{ matrix.scenario }} · 100 games
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        scenario: [balanced, aggressive, control, combo, mixed]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate 100 authentic 30-round games from merged adaptive pilot
        run: |
          mkdir -p dist/outcomes
          python tools/build_game_outcomes.py \
            --deck mortarion_physical_final \
            --scenario "${{ matrix.scenario }}" \
            --seeds 100 --start-seed 0 --rounds 30 \
            --pilot-style adaptive --pilot-archetype auto \
            --provisional-mode safe --examples 3 \
            --observations-output "dist/observations/mortarion_physical_final-${{ matrix.scenario }}.jsonl" \
            --output "dist/outcomes/mortarion_physical_final-${{ matrix.scenario }}.json"
      - name: Preserve complete observation histories for all 100 games
        uses: actions/upload-artifact@v4
        with:
          name: mortarion-observations-${{ matrix.scenario }}-${{ github.sha }}
          path: dist/observations/*.jsonl
          if-no-files-found: error
          retention-days: 90
      - name: Validate every observation record before archiving
        run: |
          python tools/validate_game_observations.py \
            --source dist/observations \
            --expected-games 100 --expected-rounds 30
      - name: Require complete card/hand/mana UI coverage for all 100 games
        run: |
          python tools/validate_outcome_ui_coverage.py \
            --source dist/outcomes --expected-games 100 --expected-rounds 30
      - name: Preserve immutable original batch
        uses: actions/upload-artifact@v4
        with:
          name: mortarion-500-${{ matrix.scenario }}-${{ github.sha }}
          path: dist/outcomes/*.json
          if-no-files-found: error
          retention-days: 90

  review-and-publish:
    if: github.event_name != 'pull_request'
    name: Review and publish Mortarion games, no other decks
    needs: simulate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Retrieve five completed scenarios
        uses: actions/download-artifact@v4
        with:
          pattern: mortarion-500-*-${{ github.sha }}
          path: dist/incoming-outcomes
          merge-multiple: true
      - name: Retrieve all per-game observation histories
        uses: actions/download-artifact@v4
        with:
          pattern: mortarion-observations-*-${{ github.sha }}
          path: dist/observations
          merge-multiple: true
      - name: Install offline analysis dependency
        run: python -m pip install "scikit-learn>=1.5,<1.9"
      - name: Validate observations and prepare permanent compressed records
        run: |
          python tools/validate_game_observations.py \
            --source dist/observations --expected-games 100 --expected-rounds 30
          mkdir -p dist/observation-archive
          for file in dist/observations/*.jsonl; do
            gzip -c -9 "$file" > "dist/observation-archive/$(basename "$file").gz"
          done
      - name: Fit exploratory elastic-net on complete observation archive
        run: |
          mkdir -p dist/analytics
          python tools/discover_game_signals.py \
            --source dist/observations \
            --output dist/analytics/mortarion_physical_final.json \
            --engine-commit "${{ github.sha }}"
      - name: Verify 500 runs and audit outcome and pilot evidence
        run: |
          python tools/review_game_outcomes.py \
            --source dist/incoming-outcomes --deck mortarion_physical_final \
            --seeds 100 --rounds 30 \
            --json-output dist/review/mortarion-500-review.json \
            --markdown-output dist/review/mortarion-500-review.md
          python tools/validate_outcome_ui_coverage.py \
            --source dist/incoming-outcomes --expected-games 100 --expected-rounds 30
          cat dist/review/mortarion-500-review.md >> "$GITHUB_STEP_SUMMARY"
          python -m unittest tests.test_game_outcome_publishing -v
      - name: Build verified Pages-compatible outcome files
        run: |
          python tools/publish_game_outcomes.py \
            --source dist/incoming-outcomes \
            --output dist/published-game-outcomes \
            --engine-commit "${{ github.sha }}"
          python - <<'PY'
          from pathlib import Path
          from tools.build_pages_deck_lab import build
          result=build(Path("dist/mortarion-preview"),
                       outcome_source=Path("dist/published-game-outcomes"))
          assert len([name for name in result["asset_sha256"]
                      if name.startswith("game-outcomes/")
                      and not name.endswith("manifest.json")])==5
          PY
          node --test tests/pages_game_outcomes.test.cjs
      - name: Retain verified data and review report
        uses: actions/upload-artifact@v4
        with:
          name: mortarion-500-evidence-and-review-${{ github.sha }}
          path: |
            dist/published-game-outcomes/*.json
            dist/review/*.json
            dist/review/*.md
            dist/observation-archive/*.gz
            dist/analytics/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Archive verified simulation release permanently
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every completed run gets its own immutable GitHub Release asset
          # before the single live Pages manifest is replaced.
          TAG="modeled-games-${{ github.run_id }}-${{ github.run_attempt }}"
          gh release create "$TAG" dist/published-game-outcomes/*.json dist/observation-archive/*.gz dist/analytics/*.json \
            --target "${{ github.sha }}" \
            --title "Modeled simulations · ${{ github.sha }}" \
            --notes "Verified source commit ${{ github.sha }}; workflow run ${{ github.run_id }}. Immutable historical batch. The live Deck Lab displays only the most recently promoted manifest." \
            --latest=false
      - name: Publish only this Mortarion cohort
        run: |
          git fetch origin main
          if ! git diff --quiet HEAD origin/main -- \
            commander_sim/ decklists/ simulator/card_data/ \
            tools/build_game_outcomes.py tools/discover_game_signals.py \
            tools/validate_game_observations.py \
            tools/validate_outcome_ui_coverage.py \
            tools/review_game_outcomes.py \
            tools/publish_game_outcomes.py \
            .github/workflows/mortarion-500-stage.yml; then
            echo "Engine or deck changed during this batch; refusing stale publication."
            exit 1
          fi
          git switch -C mortarion-outcome-release origin/main
          mkdir -p web/pages/data/game-outcomes
          rsync -a --delete dist/published-game-outcomes/ web/pages/data/game-outcomes/
          mkdir -p web/pages/data/analytics
          rsync -a --delete dist/analytics/ web/pages/data/analytics/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A web/pages/data/game-outcomes/ web/pages/data/analytics/
          if ! git diff --cached --quiet; then
            git commit -m "Publish reviewed Mortarion 500-game outcome cohort"
            git push origin HEAD:main
          fi
      - name: Trigger verified static site publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deck-lab-pages.yml --ref main
