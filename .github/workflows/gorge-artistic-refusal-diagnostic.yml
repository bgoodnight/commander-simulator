name: Trace Artistic Refusal modal cast decisions
on:
  push:
    branches: [test/gorge-four-commander-token-qualification-20261106]
    paths: [".github/workflows/gorge-artistic-refusal-diagnostic.yml"]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve original Magnus native game 219201
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          gh run download 42292766033 --repo "$GITHUB_REPOSITORY" --name gorge-token-qualification-magnus_premium --dir "$RUNNER_TEMP/source"
      - name: Print only Artistic Refusal cast mode and nearest notes
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"source/native/gorge-seed-219201.json").read_text())
          events=x["log"]["events"]
          ids={o["object_id"]:o for o in x["objects"] if o.get("card_name")=="Artistic Refusal"}
          print("ARTISTIC_IDS",json.dumps(ids,sort_keys=True))
          for oid,obj in ids.items():
              choices=[(i,e) for i,e in enumerate(events) if e.get("obj")==oid and e["kind"] in (11,35)]
              print("ARTISTIC_MODES",json.dumps({"object_id":oid,"owner":obj.get("owner"),
                "counts":{str(kind)+":"+str(text):sum(y["kind"]==kind and str(y.get("text"))==text for _,y in choices)
                    for kind,text in set((e["kind"],str(e.get("text"))) for _,e in choices)}},sort_keys=True))
              for i,e in choices[:16]:
                  around=[{"kind":z["kind"],"text":str(z.get("text") or "")[:140],"seq":z["seq"],
                           "player":z.get("player"),"obj":z.get("obj")}
                           for z in events[max(0,i-2):min(i+7,len(events))] if z["kind"] in (11,20,21,22,35,13,34)]
                  print("ARTISTIC_SEQUENCE",json.dumps({"object_id":oid,"seq":e["seq"],"around":around},sort_keys=True))
          PY
