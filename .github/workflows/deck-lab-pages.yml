name: Build and (when enabled) publish Deck Lab Pages
on:
  push:
    branches: [main]
    paths:
      - "web/pages/**"
      - "tools/build_pages_deck_lab.py"
      - "commander_sim/**"
      - "simulator/card_data/**"
      - "tests/test_pages_export.py"
      - "tests/pages_insights.test.cjs"
      - ".github/workflows/deck-lab-pages.yml"
  workflow_dispatch:
permissions:
  # Only the allowlisted static export is committed under docs/deck-lab/.
  contents: write
  pages: write
  id-token: write
concurrency:
  group: deck-lab-pages
  cancel-in-progress: false
jobs:
  build:
    name: Export sanitized static Deck Lab
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages-check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build six-deck static snapshot and fixed-seed observations
        run: python tools/build_pages_deck_lab.py --output ./dist/pages
      - name: Validate export contracts and Javascript syntax
        run: |
          python -m unittest tests.test_pages_export -v
          node --check web/pages/app.js
          node --check web/pages/results_insights.js
          node --test tests/pages_insights.test.cjs
          node --check dist/pages/app.js
          node --check dist/pages/results_insights.js
      - name: Offer a downloadable preview even before Pages is enabled
        uses: actions/upload-artifact@v4
        with:
          name: deck-lab-static-preview
          path: ./dist/pages
          retention-days: 7
      - name: Publish branch-compatible Deck Lab files under docs/deck-lab
        run: |
          # Root-index Pages can serve docs/deck-lab/ directly. This is
          # supplemental to the official workflow Pages artifact/deployment.
          # Avoid publishing stale data from a superseded build run.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main advanced since checkout; skipping stale branch export." >> "$GITHUB_STEP_SUMMARY"
          else
            mkdir -p docs/deck-lab
            rsync -a --delete ./dist/pages/ ./docs/deck-lab/
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A docs/deck-lab
            if ! git diff --cached --quiet; then
              git commit -m "Publish validated Deck Lab static site for branch-based Pages"
              if git push origin HEAD:main; then
                echo "Published the allowlisted static site in docs/deck-lab/." >> "$GITHUB_STEP_SUMMARY"
              else
                # Another commit landed between fetch and push. Never force
                # push or rebase a potentially stale public site artifact.
                echo "Main advanced during publishing; skipping stale artifact. A later run from main can safely publish the latest site." >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "Branch-compatible static site already matches export." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - name: Check Pages publishing mode (avoid competing deployments)
        id: pages-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Branch-based Pages already publishes the generated docs/deck-lab
          # directory from main. Only upload/deploy the custom Actions Pages
          # artifact if Settings > Pages explicitly selected GitHub Actions.
          # Never attempt to change the user's Pages settings or visibility.
          BUILD_TYPE="$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type' 2>/dev/null || true)"
          if [ "$BUILD_TYPE" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Pages uses GitHub Actions; deploying the verified static artifact." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            if [ -n "$BUILD_TYPE" ]; then
              echo "Pages uses branch publishing ($BUILD_TYPE). The validated static site was committed to docs/deck-lab and the normal branch Pages build will publish it. Skipping a competing custom deployment." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Pages unavailable. The validated static site remains available as a downloadable preview artifact." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - name: Configure Pages
        if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload sanitized Pages artifact
        if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist/pages
  deploy:
    name: Deploy static Deck Lab
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
