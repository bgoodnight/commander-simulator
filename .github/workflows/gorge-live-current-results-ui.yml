name: Live approved Gorge Results UI smoke
on:
  pull_request:
    paths:
      - ".github/workflows/gorge-live-current-results-ui.yml"
      - "tests/browser_gorge_live_current_baseline.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: Verify real approved Worker in live Results desktop + mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test engine
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Exercise published Pages against deployed current-baseline Worker
        env:
          BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/gorge-live-ui
        run: python tests/browser_gorge_live_current_baseline.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-current-results-ui-evidence
          path: ${{ runner.temp }}/gorge-live-ui/
          retention-days: 7
          if-no-files-found: warn
