name: Community Access permission tests

on:
  pull_request:
    paths:
      - "workers/community-access/**"
      - "workers/invitation-intake/**"
      - ".github/workflows/community-access-test.yml"
  push:
    branches:
      - "feature/cloudflare-access-community-accounts-20261106"
      - "stage/cloudflare-community-accounts-20261106"
    paths:
      - "workers/community-access/**"
      - "workers/invitation-intake/**"
      - ".github/workflows/community-access-test.yml"

permissions:
  contents: read

jobs:
  permissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test workers/community-access/*.test.mjs
      - name: Bundle protected account Worker (no deployment)
        run: npx --yes wrangler@4 deploy --dry-run --config workers/community-access/wrangler.toml
      - name: Bundle public invitation-intake Worker (no deployment)
        run: npx --yes wrangler@4 deploy --dry-run --config workers/invitation-intake/wrangler.toml
