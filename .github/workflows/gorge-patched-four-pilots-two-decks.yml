name: Gorge patched AI pilots — Mortarion and Magnus
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gorge-patched-four-pilots-two-decks.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gorge-patched-four-pilots-two-decks
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'
      - name: Rebuild pinned Gorge with controlled trigger-cost decision patch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bundle"
          gh run download 41938112091 --name gorge-500-pinned-bundle --dir "$RUNNER_TEMP/bundle"
          test -d "$RUNNER_TEMP/bundle/.cards"
          test -f "$RUNNER_TEMP/bundle/pods/mortarion_current-pod.json"
          test -f "$RUNNER_TEMP/bundle/pods/magnus_budget-pod.json"
          git clone --filter=blob:none https://github.com/adams-shaun/gorge.git "$RUNNER_TEMP/gorge"
          git -C "$RUNNER_TEMP/gorge" checkout --detach b78e4c8b16078f6decbc48875bba953ce5535b85
          python tools/gorge_trigger_cost_policy_patch.py "$RUNNER_TEMP/gorge/bots/botpolicy/policy.go"
          cp tools/gorge_trigger_cost_policy_test.go "$RUNNER_TEMP/gorge/bots/botpolicy/trigger_cost_pilot_experiment_test.go"
          (cd "$RUNNER_TEMP/gorge" && go test ./bots/botpolicy -run '^TestTriggerCostXAndPayPilot$' -count=1)
          cp tools/gorge_commander_probe.go "$RUNNER_TEMP/gorge/commander_probe.go"
          (cd "$RUNNER_TEMP/gorge" && go build -o "$RUNNER_TEMP/bundle/gorge-probe" ./commander_probe.go)
      - uses: actions/upload-artifact@v4
        with:
          name: gorge-patched-two-deck-engine
          path: ${{ runner.temp }}/bundle/
          include-hidden-files: true
          retention-days: 3

  simulate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        deck: [mortarion_current, magnus_budget]
        policy: [bot, forge-heuristic, forge-heuristic-hold, lethal-pressure]
    env:
      DECK: ${{ matrix.deck }}
      POLICY: ${{ matrix.policy }}
      R2_ACCOUNT_ID: ${{ secrets.GORGE_R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.GORGE_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.GORGE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gorge-patched-two-deck-engine
          path: ${{ runner.temp }}/bundle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Simulate 100 replay-verified games with identical precon opponents
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/bundle/gorge-probe"
          root="$RUNNER_TEMP/experiment"
          mkdir -p "$root/native"
          case "$DECK" in
            mortarion_current) seed=99000 ;;
            magnus_budget) seed=80000 ;;
            *) exit 2 ;;
          esac
          opponents="$(python -c 'import json,sys;print(",".join(json.load(open(sys.argv[1]))["opponent_pool"]))' "$RUNNER_TEMP/bundle/pods/$DECK-pod.json")"
          "$RUNNER_TEMP/bundle/gorge-probe" \
            -corpus "$RUNNER_TEMP/bundle/.cards" -deck-dir "$RUNNER_TEMP/bundle/decks" \
            -hero-deck "$DECK" -opponents "$opponents" \
            -games 100 -seed "$seed" -max-turns 60 \
            -retry-unverified=true -max-attempts 500 \
            -pilot bot -hero-pilot "$POLICY" -verify=true \
            -native-dir "$root/native" -native-limit 100 > "$root/runs.jsonl"
          python -m tools.gorge_patched_pilot_results \
            --root "$root" --deck "$DECK" --policy "$POLICY" --games 100 \
            --out "$root/results.json"
      - name: Archive complete genuine games privately in R2
        shell: bash
        run: |
          set -euo pipefail
          test -n "$R2_ACCOUNT_ID" && test -n "$R2_ACCESS_KEY_ID" && test -n "$R2_SECRET_ACCESS_KEY"
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_DEFAULT_REGION=auto
          tar -czf "$RUNNER_TEMP/$DECK-$POLICY.tar.gz" -C "$RUNNER_TEMP/experiment" native runs.jsonl results.json
          aws --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" s3 cp \
            "$RUNNER_TEMP/$DECK-$POLICY.tar.gz" \
            "s3://gorge-simulations/pilot-evaluations/v2/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/$DECK/$POLICY.tar.gz" --no-progress
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gorge-patched-result-${{ matrix.deck }}-${{ matrix.policy }}
          path: ${{ runner.temp }}/experiment/results.json
          retention-days: 14
          if-no-files-found: warn

  compare:
    needs: simulate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: gorge-patched-result-*
          path: ${{ runner.temp }}/raw-results
          merge-multiple: false
      - name: Compare common verified seeds with fixed opponent pods
        shell: bash
        run: |
          set -euo pipefail
          for deck in mortarion_current magnus_budget; do
            for policy in bot forge-heuristic forge-heuristic-hold lethal-pressure; do
              mkdir -p "$RUNNER_TEMP/pilots/$deck/$policy"
              cp "$RUNNER_TEMP/raw-results/gorge-patched-result-$deck-$policy/results.json" \
                "$RUNNER_TEMP/pilots/$deck/$policy/results.json"
            done
          done
          python -m tools.gorge_patched_pilot_compare --root "$RUNNER_TEMP/pilots" \
            --out "$RUNNER_TEMP/comparison.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"comparison.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("# Patched Gorge pilot comparison: Mortarion and Magnus\n\n")
              f.write("Hero policies vary; all opponent seats use default bot. Four-player Commander precons, same fixed corpus and attempted seed range.\n\n")
              for deck,d in r["decks"].items():
                  f.write(f"## {deck}\n\nShared truly matched seeds: **{d['matched_games']}**.\n\n")
                  f.write("| Pilot | Wins / 100 | Wilson 95% CI | Astartes tokens |\n|---|---:|---:|---:|\n")
                  for policy,p in d["policies"].items():
                      lo,hi=p["wilson_95"]
                      f.write(f"| {policy} | {p['wins']} | {lo:.1%}–{hi:.1%} | {p['astartes_tokens']} |\n")
                  f.write("\nExploratory paired exact comparisons vs bot (unadjusted for 3 comparisons):\n\n")
                  for policy,p in d["pairwise_vs_bot"].items():
                      f.write(f"- {policy}: {p['paired_win_rate_diff']:+.1%} difference; p={p['mcnemar_exact_unadjusted_p']}\n")
                  f.write("\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gorge-patched-two-deck-comparison
          path: ${{ runner.temp }}/comparison.json
          retention-days: 14
