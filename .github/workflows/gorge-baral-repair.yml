name: Gorge Baral mana reducer repair validation
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gorge-baral-repair.yml"
      - "tools/gorge_commander_probe.go"
      - "tools/gorge_baral_overlay_test.go"
      - "tools/gorge_baral_cost_rules_test.go"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'
      - name: Rebuild exact pinned Gorge and test Baral
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bundle"
          gh run download 41938112091 --name gorge-500-pinned-bundle --dir "$RUNNER_TEMP/bundle"
          test -d "$RUNNER_TEMP/bundle/.cards"
          git clone --filter=blob:none https://github.com/adams-shaun/gorge.git "$RUNNER_TEMP/gorge"
          git -C "$RUNNER_TEMP/gorge" checkout --detach b78e4c8b16078f6decbc48875bba953ce5535b85
          cp tools/gorge_commander_probe.go "$RUNNER_TEMP/gorge/commander_probe.go"
          cp tools/gorge_baral_overlay_test.go "$RUNNER_TEMP/gorge/baral_overlay_test.go"
          cp tools/gorge_baral_cost_rules_test.go "$RUNNER_TEMP/gorge/engine/rules/baral_mana_discount_validation_test.go"
          export GORGE_TEST_CORPUS="$RUNNER_TEMP/bundle/.cards"
          (cd "$RUNNER_TEMP/gorge" && go test commander_probe.go baral_overlay_test.go -run 'TestPinnedBaralCorpusOverlay' -count=1 -v)
          (cd "$RUNNER_TEMP/gorge" && go test ./engine/rules -run 'TestBaralGenericSpellDiscountInRules' -count=1 -v)
          (cd "$RUNNER_TEMP/gorge" && go build -o "$RUNNER_TEMP/bundle/gorge-probe" ./commander_probe.go)

      - name: Verify Magnus game with corrected Baral definition
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/bundle/gorge-probe"
          opponents="$(python -c 'import json,sys;print(",".join(json.load(open(sys.argv[1]))["opponent_pool"]))' "$RUNNER_TEMP/bundle/pods/magnus_budget-pod.json")"
          mkdir -p "$RUNNER_TEMP/smoke/native"
          "$RUNNER_TEMP/bundle/gorge-probe" \
            -corpus "$RUNNER_TEMP/bundle/.cards" -deck-dir "$RUNNER_TEMP/bundle/decks" \
            -hero-deck magnus_budget -opponents "$opponents" \
            -games 1 -seed 107001 -max-turns 60 \
            -retry-unverified=true -max-attempts 20 \
            -pilot bot -hero-pilot lethal-pressure -verify=true \
            -native-dir "$RUNNER_TEMP/smoke/native" -native-limit 1 > "$RUNNER_TEMP/smoke/runs.jsonl"
          python - "$RUNNER_TEMP/smoke/runs.jsonl" <<'PY'
          import json,sys
          data=[json.loads(x) for x in open(sys.argv[1]) if x.strip()]
          assert len(data)==1 and data[0]["finished"] and data[0]["replay_verified"]
          print("BARAL_SMOKE_VERIFIED "+json.dumps({"seed":data[0]["seed"],"replay_verified":data[0]["replay_verified"]}))
          PY
