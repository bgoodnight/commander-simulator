name: Gorge real 100-game warehouse benchmark
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gorge-real-100-warehouse.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gorge-real-100-warehouse
  cancel-in-progress: false

jobs:
  real-warehouse:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      R2_ACCOUNT_ID: ${{ secrets.GORGE_R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.GORGE_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.GORGE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load pinned Gorge engine bundle used by four-deck benchmark
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bundle"
          gh run download 41938112091 --name gorge-500-pinned-bundle --dir "$RUNNER_TEMP/bundle"
          test -f "$RUNNER_TEMP/bundle/gorge-probe"
          test -d "$RUNNER_TEMP/bundle/.cards"
          test -f "$RUNNER_TEMP/bundle/pods/mortarion_current-pod.json"
          chmod +x "$RUNNER_TEMP/bundle/gorge-probe"
      - name: Run 100 genuine verified Gorge Commander games with full traces
        shell: bash
        run: |
          set -euo pipefail
          deck=mortarion_current
          folder="$RUNNER_TEMP/real-shard"
          mkdir -p "$folder/native"
          cp "$RUNNER_TEMP/bundle/pods/$deck-pod.json" "$folder/pod.json"
          opponents="$(python -c 'import json,sys;print(",".join(json.load(open(sys.argv[1]))["opponent_pool"]))' "$folder/pod.json")"
          "$RUNNER_TEMP/bundle/gorge-probe" \
            -corpus "$RUNNER_TEMP/bundle/.cards" \
            -deck-dir "$RUNNER_TEMP/bundle/decks" \
            -hero-deck "$deck" -opponents "$opponents" \
            -games 100 -seed 95000 -max-turns 60 \
            -retry-unverified=true -max-attempts 500 \
            -pilot bot -verify=true \
            -native-dir "$folder/native" -native-limit 100 \
            > "$folder/runs.jsonl"
          python - "$folder" <<'PY'
          import json,sys
          from pathlib import Path
          folder=Path(sys.argv[1])
          records=[json.loads(x) for x in (folder/"runs.jsonl").read_text().splitlines() if x.strip()]
          assert len(records)==100
          assert len({r["seed"] for r in records})==100
          assert all(r["finished"] and r["replay_verified"] and not r.get("error") for r in records)
          assert all(r["decks"][r["hero_seat"]]=="mortarion_current" for r in records)
          assert len(list((folder/"native").glob("gorge-seed-*.json")))==100
          print("Validated 100 real games and all 100 native recordings")
          PY
      - name: Convert and time actual source-backed Parquet queries
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'duckdb==1.4.1' 'pyarrow==21.0.0'
          python -m unittest tests.test_gorge_warehouse_export -v
          python -m tools.gorge_warehouse_export \
            --shard-folder "$RUNNER_TEMP/real-shard" \
            --out "$RUNNER_TEMP/real-warehouse" \
            --batch-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --deck mortarion_current --shard 0
          python -m tools.gorge_real_warehouse_benchmark \
            --warehouse "$RUNNER_TEMP/real-warehouse" --expected-games 100
      - name: Archive native traces and Parquet to private R2; test roundtrip
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$R2_ACCOUNT_ID" || -z "$R2_ACCESS_KEY_ID" || -z "$R2_SECRET_ACCESS_KEY" ]]; then
            echo "::error::Missing one or more GORGE_R2_* secrets"
            exit 1
          fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto
          endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          prefix="warehouse/v1/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/mortarion_current/0"
          native_key="native/v1/mortarion_current/0/real-100-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          tar -czf "$RUNNER_TEMP/real-native.tar.gz" -C "$RUNNER_TEMP/real-shard" native runs.jsonl pod.json
          aws --endpoint-url "$endpoint" s3 cp "$RUNNER_TEMP/real-native.tar.gz" \
            "s3://gorge-simulations/$native_key" --no-progress
          aws --endpoint-url "$endpoint" s3 cp "$RUNNER_TEMP/real-warehouse/" \
            "s3://gorge-simulations/$prefix/" --recursive --no-progress
          mkdir -p "$RUNNER_TEMP/roundtrip"
          start="$(date +%s%N)"
          aws --endpoint-url "$endpoint" s3 cp \
            "s3://gorge-simulations/$prefix/events.parquet" \
            "$RUNNER_TEMP/roundtrip/events.parquet" --no-progress
          end="$(date +%s%N)"
          python - "$RUNNER_TEMP/real-warehouse" "$RUNNER_TEMP/roundtrip/events.parquet" "$start" "$end" <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          original=Path(sys.argv[1]); received=Path(sys.argv[2])
          assert hashlib.sha256(received.read_bytes()).digest()==hashlib.sha256((original/"events.parquet").read_bytes()).digest()
          report=json.loads((original/"real-benchmark.json").read_text())
          report["r2_event_download_ms"]=round((int(sys.argv[4])-int(sys.argv[3]))/1e6,2)
          report["private_r2_verified"]=True
          (original/"real-benchmark.json").write_text(json.dumps(report,indent=2)+"\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("# Real Gorge 100-game warehouse benchmark\n\n")
              f.write(f"Validated **{report['games']} real games and {report['events']:,} native events**.\n\n")
              f.write("| Operation | Median (ms) |\n|---|---:|\n")
              for name,data in report["query_latency"].items():
                  f.write(f"| {name} | {data['median_ms']} |\n")
              f.write(f"| R2 event file download | {report['r2_event_download_ms']} |\n")
              f.write(f"\nSource-backed event Parquet: {report['files']['events.parquet']:,} bytes.\n")
              f.write("All authoritative native logs and Parquet retained in private R2.\n")
          print("REAL_GORGE_R2_BENCHMARK "+json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gorge-real-100-query-results
          path: ${{ runner.temp }}/real-warehouse/real-benchmark.json
          if-no-files-found: warn
          retention-days: 14
