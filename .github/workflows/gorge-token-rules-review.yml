name: Review Gorge token recipes in four retained batches
on:
  push:
    branches: [test/gorge-four-commander-token-qualification-20261106]
    paths: [".github/workflows/gorge-token-rules-review.yml"]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        hero: [mortarion_current, magnus_premium, necron_dynasties, wretched_ranks]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recover complete recorded game states
        env:
          GH_TOKEN: ${{ github.token }}
          HERO: ${{ matrix.hero }}
        run: |
          mkdir -p "$RUNNER_TEMP/native-source"
          gh run download 42292766033 --repo "$GITHUB_REPOSITORY" \
            --name "gorge-token-qualification-$HERO" --dir "$RUNNER_TEMP/native-source"
      - name: Produce rule evidence without rerunning source games
        env:
          HERO: ${{ matrix.hero }}
        run: |
          python -m tools.gorge_token_rules_review --root "$RUNNER_TEMP/native-source" \
             --hero "$HERO" --output "$RUNNER_TEMP/rules-review.json"
      - uses: actions/upload-artifact@v4
        with:
          name: token-rules-review-${{ matrix.hero }}
          path: ${{ runner.temp }}/rules-review.json
          retention-days: 14
